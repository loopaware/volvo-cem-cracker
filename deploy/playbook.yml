---
- name: Deploy Volvo CEM Cracker to Pi Zero
  hosts: pizeros
  become: no
  vars:
    app_dir: "/home/{{ ansible_user }}/volvo-cem-cracker"
    venv_dir: "{{ app_dir }}/venv"
    
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      become: yes

    - name: Install system dependencies
      apt:
        name:
          - git
          - python3-pip
          - python3-venv
          - python3-dev
          - can-utils
          - i2c-tools
          - libgpiod-dev
          - python3-rpi.gpio
          - python3-pil
        state: present
      become: yes

    - name: Ensure Application Directory Exists
      file:
        path: "{{ app_dir }}/src"
        state: directory
        mode: '0755'

    - name: Copy Source Files
      copy:
        src: "../src/{{ item }}"
        dest: "{{ app_dir }}/src/{{ item }}"
        mode: '0644'
      loop:
        - volvo_cracker.py
        - oled_monitor.py

    - name: Copy Documentation & Misc
      copy:
        src: "../{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        mode: '0644'
      loop:
        - README.md
        - crack.log

    - name: Copy Legacy Scripts
      copy:
        src: "../scripts"
        dest: "{{ app_dir }}/"
        mode: '0755'

    - name: Ensure log file exists and is writable
      file:
        path: "{{ app_dir }}/crack.log"
        state: touch
        mode: '0666'

    - name: Create Python Virtual Environment
      command: python3 -m venv --system-site-packages {{ venv_dir }}
      args:
        creates: "{{ venv_dir }}/bin/activate"

    - name: Install Python Dependencies
      pip:
        virtualenv: "{{ venv_dir }}"
        name:
          - python-can
          - adafruit-circuitpython-ssd1306
          - adafruit-blinka
          # RPi.GPIO and pillow are provided by system
        state: present

    - name: Copy Systemd Services
      copy:
        src: "../services/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - volvo-cracker.service
        - oled-monitor.service
      become: yes

    - name: Configure Service Paths (volvo-cracker)
      replace:
        path: "/etc/systemd/system/volvo-cracker.service"
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - { regexp: '__VENV_PYTHON__', replace: '{{ venv_dir }}/bin/python3' }
        - { regexp: '__APP_DIR__', replace: '{{ app_dir }}' }
      become: yes

    - name: Configure Service Paths (oled-monitor)
      replace:
        path: "/etc/systemd/system/oled-monitor.service"
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - { regexp: '__VENV_PYTHON__', replace: '{{ venv_dir }}/bin/python3' }
        - { regexp: '__APP_DIR__', replace: '{{ app_dir }}' }
      become: yes

    - name: Reload Systemd
      systemd:
        daemon_reload: yes
      become: yes

    - name: Enable and Start OLED Monitor
      systemd:
        name: oled-monitor
        enabled: yes
        state: restarted
      become: yes

    - name: Enable and Start Volvo Cracker Service
      systemd:
        name: volvo-cracker
        enabled: yes
        state: restarted
      become: yes

    - name: Create Launch Wrapper
      copy:
        dest: "{{ app_dir }}/run.sh"
        content: |
          #!/bin/bash
          cd {{ app_dir }}
          source venv/bin/activate
          python3 src/volvo_cracker.py
        mode: '0755'